name: NanoTrade cocotb / Verilator CI
on:
  push:
    paths:
      - "nanotrade-rtl/**"
      - ".github/workflows/nanotrade-ci.yml"
  pull_request:
    paths:
      - "nanotrade-rtl/**"
      - ".github/workflows/nanotrade-ci.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nanotrade-rtl
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install cocotb and pytest
        run: python -m pip install -r requirements.txt
      - name: RTL lint
        run: make lint
      - name: cocotb simulation (directed + randomized)
        run: make test
